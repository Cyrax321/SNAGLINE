[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snagline-agent"
version = "0.1.0"
description = "Lightweight, dependency-free real-time failure detection for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agents", "llm", "observability", "monitoring", "fail-open"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []  # core: zero required dependencies, non-negotiable

[project.optional-dependencies]
# Framework adapters that actually ship in this release:
langchain  = ["langchain-core>=0.2"]
langgraph  = ["langgraph>=0.2"]
# SDKs used by the bundled demos (real agent harnesses):
openai     = ["openai>=1.0"]
anthropic  = ["anthropic>=0.30"]
# Optional extras (not required for the core fail-open detector):
ml         = ["numpy>=1.24", "scikit-learn>=1.3"]   # future baseline fitting (ml extra)
drift      = ["sentence-transformers>=2.2"]          # future semantic-drift detector
slack      = ["httpx>=0.27"]                          # Slack escalation sink
all        = ["snagline-agent[langchain,langgraph,openai,anthropic,ml,drift,slack]"]

[project.scripts]
snagline = "snagline.cli:main"

[project.urls]
Homepage = "https://github.com/Cyrax321/SNAGLINE"

[tool.setuptools.packages.find]
where = ["src"]

# --- Lint / format (issue #11) -------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use loose typing and dummy implementations.
"tests/*" = ["B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

# --- Static typing (issue #11) -------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_ignores = false
warn_redundant_casts = false
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

# --- Coverage (issue #11) ------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=snagline --cov-fail-under=80"

[tool.coverage.run]
source = ["src/snagline"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
