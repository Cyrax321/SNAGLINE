name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (zero core deps + dev tooling)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          # optional extra: without langchain-core the integration test silently
          # skips, so CI would never run it — install it explicitly
          pip install "langchain-core>=0.2"
          pip install "pytest" "pytest-cov==7.1.0" "ruff==0.16.3" "mypy"

      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          ruff check src tests
          ruff format --check src tests

      - name: Type-check (mypy)
        run: |
          . .venv/bin/activate
          mypy src

      - name: Run tests with coverage
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q

  test-ml:
    # Exercises the optional ml extra so its tests always run somewhere;
    # they skip gracefully in the zero-dependency legs above (issue #80).
    name: Test (py3.12, ml extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install (core + ml extra + dev tooling)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[ml]"
          pip install "pytest" "pytest-cov==7.1.0"

      - name: Run tests with coverage
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q
