name: Auto Assign

on:
  pull_request_target:
    types: [opened]

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign PR to owner
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                assignees: ['Cyrax321'],
              });
            } catch (e) {
              if (e.status === 403) {
                console.log('Assign skipped: Resource not accessible (likely fork PR with limited token). ' + e.message);
                return;
              }
              throw e;
            }
